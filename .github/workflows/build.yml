name: Build BoringSSL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Windows / ${{ matrix.build_type }} / ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        arch: [x64, x86]
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up NASM
      uses: ilammy/setup-nasm@v1

    - name: Configure CMake
      shell: cmd
      run: |
        cd boringssl
        cmake -S . -B ./PrjVisualStudio -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }}

    - name: Build
      shell: cmd
      run: |
        cd boringssl
        cmake --build ./PrjVisualStudio --config ${{ matrix.build_type }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: boringssl-windows-${{ matrix.arch }}-${{ matrix.build_type }}
        retention-days: 1
        path: |
          boringssl/PrjVisualStudio/crypto/${{ matrix.build_type }}/*.lib
          boringssl/PrjVisualStudio/ssl/${{ matrix.build_type }}/*.lib
          boringssl/PrjVisualStudio/decrepit/${{ matrix.build_type }}/*.lib
          boringssl/PrjVisualStudio/tool/${{ matrix.build_type }}/bssl.exe
