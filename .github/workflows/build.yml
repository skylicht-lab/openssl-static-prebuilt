name: Build BoringSSL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows / ${{ matrix.build_type }} / ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        arch: [x64, x86]
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up NASM
      uses: ilammy/setup-nasm@v1

    - name: Configure CMake
      shell: cmd
      run: |
        cd boringssl
        cmake -S . -B ./PrjVisualStudio -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }} -DBUILD_TESTING=OFF

    - name: Build
      shell: cmd
      run: |
        cd boringssl
        cmake --build ./PrjVisualStudio --config ${{ matrix.build_type }}

  build-android:
    name: Android / ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Ninja
      run: sudo apt-get install -y ninja-build

    - name: Configure CMake
      run: |
        cd boringssl
        cmake -S . -B build_${{ matrix.abi }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
          -DBUILD_TESTING=OFF \
          -GNinja

    - name: Build
      run: |
        cd boringssl
        cmake --build build_${{ matrix.abi }}

  build-ios:
    name: iOS / ${{ matrix.sdk }} / ${{ matrix.arch }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
        arch: [arm64]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Ninja
      run: brew install ninja

    - name: Configure CMake
      run: |
        cd boringssl
        cmake -S . -B build_${{ matrix.sdk }}_${{ matrix.arch }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }} \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
          -DBUILD_TESTING=OFF \
          -GNinja

    - name: Build
      run: |
        cd boringssl
        cmake --build build_${{ matrix.sdk }}_${{ matrix.arch }}

  build-macos:
    name: macOS / ${{ matrix.arch }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Ninja
      run: brew install ninja

    - name: Configure CMake
      run: |
        cd boringssl
        cmake -S . -B build_${{ matrix.arch }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
          -DBUILD_TESTING=OFF \
          -GNinja

    - name: Build
      run: |
        cd boringssl
        cmake --build build_${{ matrix.arch }}

  build-linux:
    name: Linux / ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [x64]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Configure CMake
      run: |
        cd boringssl
        cmake -S . -B build_${{ matrix.arch }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTING=OFF \
          -GNinja

    - name: Build
      run: |
        cd boringssl
        cmake --build build_${{ matrix.arch }}
